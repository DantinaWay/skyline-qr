<title>Skyline QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a full-bleed 3D city stage with a floating control column on the left; on phones the column stacks under the stage */
  :root {
    --panel: rgba(251, 250, 246, 0.92);
    --panel-solid: #fbfaf6;
    --ink: #1c1e26;
    --muted: #636775;
    --line: #e1ded5;
    --field: #ffffff;
    --chip: #f1efe8;
    --chip-hover: #e8e5dc;
    --accent: #b0563c;
    --fd-blue: #334bff;
    --on-accent: #ffffff;
    --ok: #1d8a4b;
    --bad: #c03d29;
    --f-display: 'Silkscreen', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --f-body: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(19, 21, 27, 0.9);
      --panel-solid: #13151b;
      --ink: #eceae4;
      --muted: #9a9eaa;
      --line: #2a2d37;
      --field: #0d0f14;
      --chip: #1c1f27;
      --chip-hover: #252933;
      --ok: #4cc27e;
      --bad: #ff7a63;
      --fd-blue: #7083ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(19, 21, 27, 0.9);
    --panel-solid: #13151b;
    --ink: #eceae4;
    --muted: #9a9eaa;
    --line: #2a2d37;
    --field: #0d0f14;
    --chip: #1c1f27;
    --chip-hover: #252933;
    --ok: #4cc27e;
    --bad: #ff7a63;
    --fd-blue: #7083ff;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--panel-solid); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { position: relative; height: 100%; }

  .stage {
    position: absolute; inset: 0; overflow: hidden;
    --sky-top: #8fbcd8; --sky-bot: #f6d2a6;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 66%, var(--sky-bot) 100%);
    transition: background 0.6s;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .stage.aerial canvas { cursor: default; }

  .stars {
    position: absolute; inset: 0 0 35% 0; opacity: 0; transition: opacity 0.6s; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 44% 26%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 61% 12%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 73% 30%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 86% 6%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 93% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 4%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 36% 38%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 44%, #fff 50%, transparent 51%);
  }
  .stage.night .stars { opacity: 0.85; }
  .orb {
    position: absolute; top: 11%; right: 14%; width: 54px; height: 54px; pointer-events: none;
    filter: drop-shadow(0 0 22px rgba(255, 236, 180, 0.85));
  }
  .orb i {
    display: block; width: 100%; height: 100%; background: #fff3c4;
    clip-path: polygon(30% 0, 70% 0, 70% 10%, 90% 10%, 90% 30%, 100% 30%, 100% 70%, 90% 70%, 90% 90%, 70% 90%, 70% 100%, 30% 100%, 30% 90%, 10% 90%, 10% 70%, 0 70%, 0 30%, 10% 30%, 10% 10%, 30% 10%);
  }
  .stage.night .orb { filter: drop-shadow(0 0 16px rgba(200, 210, 255, 0.6)); width: 40px; height: 40px; }
  .stage.night .orb i { background: #eeeadd; }

  .hud-top {
    position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    pointer-events: none;
  }
  .place {
    font-family: var(--f-display); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--panel); color: var(--ink); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
  }
  .coords { font-family: var(--f-mono); font-size: 11px; color: var(--ink); background: var(--panel); padding: 3px 8px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .hud-bottom {
    position: absolute; right: 16px; bottom: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: flex-end; align-items: center; pointer-events: none;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; max-width: 100%;
  }
  .pill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { transition: opacity 0.4s; }

  .panel {
    position: absolute; left: 20px; top: 20px; bottom: 20px; width: 340px; overflow: auto;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 22px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; flex-direction: column; gap: 12px; }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; display: block; flex: none; border-radius: 22%; box-shadow: 0 0 0 1px var(--line); }
  .brand-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .byline { font-size: 12.5px; color: var(--muted); letter-spacing: 0.01em; text-decoration: none; align-self: flex-start; }
  .byline:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .byline:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .byline b { color: var(--fd-blue); font-weight: 700; }
  .mark { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.02em; }
  .mark span { color: var(--accent); margin-left: 6px; }
  .lede { margin: 0; color: var(--muted); line-height: 1.45; text-wrap: pretty; }

  .step { display: flex; flex-direction: column; gap: 10px; }
  .step-label {
    display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .step-label b {
    font-family: var(--f-display); font-weight: 400; width: 20px; height: 20px; display: inline-grid; place-items: center;
    background: var(--ink); color: var(--panel-solid); border-radius: 4px; font-size: 11px; letter-spacing: 0;
  }
  .url-field { display: flex; align-items: center; background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; }
  .url-field:focus-within { border-color: var(--accent); }
  .url-field input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--f-mono);
    font-size: 14px; padding: 13px 0; outline: none;
  }
  .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .note { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .note:empty { display: none; }
  .note.warn { color: var(--bad); }

  .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .city {
    display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 10px; background: var(--chip);
    border: 1.5px solid transparent; border-radius: 10px;
  }
  .city:hover { background: var(--chip-hover); }
  .city[aria-pressed="true"] { border-color: var(--accent); background: var(--field); }
  .city .strip { display: grid; grid-template-columns: repeat(4, 1fr); height: 12px; border-radius: 3px; overflow: hidden; }
  .city .nm { font-weight: 600; font-size: 14px; line-height: 1.1; }
  .city .sub { font-size: 12px; color: var(--muted); }

  .palettes { display: flex; flex-direction: column; gap: 6px; }
  .pal {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--chip); border: 1.5px solid transparent;
    border-radius: 9px; text-align: left; font-size: 14px;
  }
  .pal:hover { background: var(--chip-hover); }
  .pal[aria-pressed="true"] { border-color: var(--accent); background: var(--field); }
  .pal .sw { display: flex; gap: 3px; }
  .pal .sw i { width: 14px; height: 14px; border-radius: 3px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 8px; border-radius: 7px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--field); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .fly {
    border: 0; background: var(--accent); color: var(--on-accent); font-family: var(--f-display); font-size: 17px;
    letter-spacing: 0.04em; padding: 15px 16px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 3px 0 rgba(0,0,0,.22);
  }
  .fly:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
  .ghost { border: 1.5px solid var(--line); background: transparent; padding: 11px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .ghost:hover { background: var(--chip); }
  .ghost:disabled { opacity: .5; cursor: progress; }

  .modal { position: fixed; inset: 0; background: rgba(8, 10, 16, 0.6); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal-card {
    background: var(--panel-solid); color: var(--ink); border-radius: 14px; padding: 18px; width: min(460px, 100%);
    display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line);
  }
  .modal-card img { width: 100%; border-radius: 8px; image-rendering: pixelated; }
  .modal-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--panel-solid);
    padding: 9px 14px; border-radius: 8px; font-size: 14px; z-index: 11;
  }
  .fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #1c1e26; font-size: 15px; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { height: auto; display: flex; flex-direction: column; }
    .stage { position: relative; height: 56vh; min-height: 320px; }
    .panel {
      position: static; width: auto; border-radius: 0; border: 0; border-top: 1px solid var(--line); overflow: visible;
      padding: 20px 16px 28px; background: var(--panel-solid); backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .actions { order: -1; flex-direction: row; }
    .actions .fly { flex: 1.4; }
    .actions .ghost { flex: 1; }
    .brand { order: -2; }
    .lede { display: none; }
    .logo { width: 34px; height: 34px; }
    .mark { font-size: 22px; }
    .hud-top { top: 12px; right: 12px; }
    .hud-bottom { right: 12px; bottom: 12px; left: 12px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage, .stars, .hint { transition: none; }
  }
</style>

    <section class="step">
      <label class="step-label" for="url"><b>1</b> Your link</label>
      <div class="url-field"><input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" value="https://example.com" placeholder="yourwebsite.com"></div>
      <div class="meta" id="meta"></div>
      <div class="note" id="note"></div>
    </section>

      <div class="step-label"><b>2</b> City</div>
      <div class="cities" id="cities"></div>
    </section>

      <div class="step-label"><b>3</b> Colours</div>
      <div class="palettes" id="palettes"></div>

    }
    for (const b of lightBlocks) {
      const top = b.hi + city.lightHeight(b, ctx);
      bld(b.x0, b.x1, b.z0, b.z1, b.lo, top, pick(P.lightWalls || P.walls, b.r, b.c, 53), P.lightRoof, b.r * 77 + b.c);
    }

    // ground: light streets and the quiet zone, with cliffs where the terrain steps
    const cliffA = nightMode ? night(P.cliff) : col(P.cliff), cliffB = cliffA.clone().multiplyScalar(0.88);
    for (let i = 0; i < M; i++) for (let j = 0; j < M; j++) {
      const r = i - Q, c = j - Q, h = Tm[i * M + j], x0 = c - N / 2, x1 = x0 + 1, z0 = r - N / 2, z1 = z0 + 1;
      const inCode = r >= 0 && r < N && c >= 0 && c < N;
      if (occ[i * M + j] > 1e8) face('t', x0, x1, 0, h, z0, z1, col(inCode && hash(r, c, 9) < 0.3 ? P.ground2 : P.ground), S.solid);
      const cap = Math.min(h, occ[i * M + j]);
      for (const [d, ii, jj] of [['f', i + 1, j], ['b', i - 1, j], ['r', i, j + 1], ['l', i, j - 1]]) {
        const hn = (ii < 0 || jj < 0 || ii >= M || jj >= M) ? 0 : Tm[ii * M + jj];
        if (cap > hn + 1e-4) face(d, x0, x1, hn, cap, z0, z1, hash(i, j, 61) < 0.5 ? cliffA : cliffB, S.solid);
      }
    }
    face('t', -500, 500, -1, -0.02, -500, 500, nightMode ? night(P.base) : col(P.base), S.solid);
    if (city.extras) city.extras(ctx);
    if (!nightMode) clouds(ctx);

    for (const m of meshes) { scene.remove(m); m.geometry.dispose(); }
    const tex = wallTextures(state.city);
    wallMat.map = tex.map; wallMat.emissiveMap = tex.lit; wallMat.needsUpdate = true;
    meshes = [new THREE.Mesh(S.wall.geo(), wallMat), new THREE.Mesh(S.solid.geo(), solidMat), new THREE.Mesh(S.neon.geo(), neonMat)];
    cloudMesh = new THREE.Mesh(S.cloud.geo(), cloudMat);
    meshes.push(cloudMesh);
    for (const m of meshes) scene.add(m);

    view.E = E; view.N = N; view.Q = Q; view.maxTop = maxTop;
    fog.near = 200 + E + 4; fog.far = 200 + E + 95;
  }

  /* ---------- camera & lights ---------- */
  const sideDir = new THREE.Vector3(-0.55, 0.75, 0.45).normalize(), topDir = new THREE.Vector3(0, 1, 0);
  function setLights(k) {
    const n = state.night;
    amb.intensity = lerp(n ? 0.24 : 0.5, 0.45, k);
    sun.intensity = lerp(n ? 0.3 : 0.64, 0.55, k);
    amb.color.copy(col(n ? '#8090d8' : '#fff4e8')).lerp(WHITE, k);
    sun.color.copy(col(n ? '#bac6ff' : '#fff1dc')).lerp(WHITE, k);
    sun.position.copy(sideDir).lerp(topDir, k).normalize();
    wallMat.emissiveIntensity = n ? 1 : 0;
  }
  function updateCamera(now, k) {
    const sway = reduceMotion ? 0 : 0.1 * Math.sin(now * 0.00025);
    const a = (-0.42 + sway + drag.az) * (1 - k);
    const e = lerp(9, 90, k) * Math.PI / 180;
    const { E, N, Q, maxTop: mt } = view;
    const ty = lerp(mt * 0.52, 0, k);
    const dx = Math.cos(e) * Math.sin(a), dy = Math.sin(e), dz = Math.cos(e) * Math.cos(a);
    camera.position.set(dx * 200, ty + dy * 200, dz * 200);
    camera.up.set(-Math.sin(e) * Math.sin(a), Math.cos(e), -Math.sin(e) * Math.cos(a));
    camera.lookAt(0, ty, 0);
    const effW = Math.max(1, vp.w - vp.off), aspEff = effW / vp.h;
    const e0 = 9 * Math.PI / 180;
    const sideHalfW = (E + 3) * 1.18;
    const sideH = Math.max(sideHalfW / aspEff, (mt * Math.cos(e0) + 2 * E * Math.sin(e0)) * 0.6);
    const topHalf = N / 2 + Q + 1.5;
    const topH = Math.max(topHalf, topHalf / aspEff) * 1.04;
    const hh = Math.exp(lerp(Math.log(sideH), Math.log(topH), k)) * (1 + 0.18 * Math.sin(Math.PI * k));
    const hw = hh * vp.w / vp.h, shift = (vp.off / vp.w) * hw;
    camera.left = -hw - shift; camera.right = hw - shift; camera.top = hh; camera.bottom = -hh;
    camera.updateProjectionMatrix();
  }
  function resize() {
    const r = stage.getBoundingClientRect();
    vp.w = Math.max(1, r.width); vp.h = Math.max(1, r.height);
    vp.off = window.innerWidth > 760 ? Math.max(0, panel.getBoundingClientRect().right - r.left) : 0;
    renderer.setSize(vp.w, vp.h, false);
  }
  new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  /* ---------- top-down render (PNG) ---------- */
  function renderTop(size, extra = 1.5) {
    const half = view.N / 2 + view.Q + extra;
    const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 1400);
    cam.position.set(0, 200, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
    const rt = new THREE.WebGLRenderTarget(size, size);
    setLights(1); scene.fog = null; if (cloudMesh) cloudMesh.visible = false;
    renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, cam);
    const buf = new Uint8Array(size * size * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, size, size, buf);
    renderer.setRenderTarget(null); rt.dispose(); scene.fog = fog;
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const g = cv.getContext('2d'), img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) img.data.set(buf.subarray((size - 1 - y) * size * 4, (size - y) * size * 4), y * size * 4);
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
    g.putImageData(img, 0, 0);
    return cv;
  }

  /* ---------- UI ---------- */
  const urlEl = $('#url'), metaEl = $('#meta'), noteEl = $('#note');
  function normalizeUrl(s) {
    s = s.trim();
    if (!s) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[^\s/]+\.[^\s]+$/.test(s)) return 'https://' + s;
    return s;
  }
  function setNote(text, warn) { noteEl.textContent = text; noteEl.className = 'note' + (warn ? ' warn' : ''); }
  function readUrl() {
    const enc = normalizeUrl(urlEl.value);
    if (!enc) { setNote('Enter a link to build your city.', true); return false; }
    let q;
    try { q = qrcode(0, 'H'); q.addData(enc); q.make(); }
    catch (e) { setNote('That link is too long for a QR code. Try a shorter one.', true); return false; }
    const N = q.getModuleCount(), m = new Uint8Array(N * N);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) m[r * N + c] = q.isDark(r, c) ? 1 : 0;
    state.qr = { N, dark: (r, c) => m[r * N + c] === 1 };
    state.enc = enc;
    const len = enc.length;
    metaEl.textContent = `${N} × ${N} blocks · ${len} characters` + (enc !== urlEl.value.trim() ? ` · encodes ${enc}` : '');
    if (N >= 41) setNote('Long link: the city gets dense and the blocks get small. A shorter link gives a bolder skyline.', false);
    else if (N <= 29) setNote('Short link: big, bold buildings.', false);
    else setNote('', false);
    return true;
  }

  function applyLook() {
    const c = CITIES[state.city], P = c.palettes[state.pal], sky = state.night ? P.skyN : P.skyD;
    stage.style.setProperty('--sky-top', sky[0]);
    stage.style.setProperty('--sky-bot', sky[1]);
    stage.classList.toggle('night', state.night);
    fog.color.set(sky[1]);
    document.documentElement.style.setProperty('--accent', P.accent);
    $('#place').textContent = c.name;
    $('#coords').textContent = c.coords;
  }

  const citiesEl = $('#cities'), palsEl = $('#palettes');
  function renderCities() {
    citiesEl.innerHTML = '';
    for (const key of ORDER) {
      const c = CITIES[key], P = c.palettes[0];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'city'; b.setAttribute('aria-pressed', String(key === state.city));
      b.innerHTML = `<span class="strip">${[P.skyD[0], P.walls[0], P.roofs[0], P.ground].map((h) => `<i style="background:${h}"></i>`).join('')}</span><span class="nm"></span><span class="sub"></span>`;
      b.querySelector('.nm').textContent = c.name; b.querySelector('.sub').textContent = c.sub;
      b.addEventListener('click', () => { if (state.city === key) return; state.city = key; state.pal = 0; refresh(); });
      citiesEl.appendChild(b);
    }
  }
  function renderPalettes() {
    palsEl.innerHTML = '';
    CITIES[state.city].palettes.forEach((P, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pal'; b.setAttribute('aria-pressed', String(i === state.pal));
      b.innerHTML = `<span class="sw">${[P.walls[0], P.walls[1], P.roofs[0], P.ground].map((h) => `<i style="background:${h}"></i>`).join('')}</span><span></span>`;
      b.lastChild.textContent = P.name;
      b.addEventListener('click', () => { if (state.pal === i) return; state.pal = i; refresh(); });
      palsEl.appendChild(b);
    });
  }
  function refresh() {
    renderCities(); renderPalettes(); applyLook(); build();
  }

  let inputTimer = 0;
  urlEl.addEventListener('input', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => { if (readUrl()) build(); }, 160);
  });
  urlEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); urlEl.blur(); } });

  const dayBtn = $('#day'), nightBtn = $('#night');
  function setNight(v) {
    if (state.night === v) return;
    state.night = v; dayBtn.setAttribute('aria-pressed', String(!v)); nightBtn.setAttribute('aria-pressed', String(v));
    applyLook(); build();
  }
  dayBtn.addEventListener('click', () => setNight(false));
  nightBtn.addEventListener('click', () => setNight(true));

  const flyBtn = $('#fly');
  flyBtn.addEventListener('click', () => {
    anim.target = anim.target === 1 ? 0 : 1;
    flyBtn.innerHTML = anim.target === 1 ? 'Back to street <span aria-hidden="true">↓</span>' : 'Fly up <span aria-hidden="true">↑</span>';
    stage.classList.toggle('aerial', anim.target === 1);
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (anim.target === 1) return;
    drag.on = true; drag.x = e.clientX;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag.on) return;
    drag.az = Math.max(-1.1, Math.min(1.1, drag.az - (e.clientX - drag.x) * 0.006));
    drag.x = e.clientX;
  });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(t, () => { drag.on = false; });

  /* ---------- download ---------- */
  const downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  const modal = $('#modal'), toastHost = document.body;
  function toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; toastHost.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
  function showModal(cv) { $('#modal-img').src = cv.toDataURL('image/png'); modal.hidden = false; $('#modal-close').focus(); }
  $('#modal-close').addEventListener('click', () => { modal.hidden = true; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.hidden = true; });

  const dlBtn = $('#dl');
  dlBtn.addEventListener('click', async () => {
    dlBtn.disabled = true;
    try {
      const cv = renderTop(2048, 2);
      const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
      const dl = await Promise.race([downloadsP, new Promise((r) => setTimeout(() => r(null), 1500))]);
      const name = `skyline-qr-${state.city}-${CITIES[state.city].palettes[state.pal].name.toLowerCase().replace(/[^a-z]+/g, '-')}.png`;
      if (dl && blob) {
        try { await dl.save({ filename: name, data: blob }); toast('Saved ' + name); }
        catch (err) { if (!err || err.code !== 'declined') showModal(cv); }
      } else if (!window.claude && blob) { // standalone site: a normal browser download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('Saved ' + name);
      } else showModal(cv);
    } finally { dlBtn.disabled = false; }
  });

  /* ---------- loop ---------- */
  const orb = $('#orb'), hint = $('#hint');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(250, now - last); last = now;
    if (anim.t !== anim.target) {
      const step = reduceMotion ? 1 : dt / 2400;
      anim.t = anim.target > anim.t ? Math.min(anim.target, anim.t + step) : Math.max(anim.target, anim.t - step);
    }
    const k = ease(anim.t);
    updateCamera(now, k);
    setLights(k);
    if (cloudMesh) cloudMesh.visible = k < 0.3;
    orb.style.opacity = String(Math.max(0, 1 - k * 2.5));
    hint.style.opacity = k < 0.05 ? '1' : '0';
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize();
  if (!readUrl()) { urlEl.value = 'https://example.com'; readUrl(); }
  refresh();
  requestAnimationFrame(frame);
})();
</script>
